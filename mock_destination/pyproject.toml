[project]
name = "mock-destination"
version = "0.1.0"
description = "Deliberately unreliable destination API used as the primary demo target."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_destination"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
