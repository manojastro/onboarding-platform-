server {
    listen 80;

    # Slightly above the API's 10 MiB limit so that near-limit uploads reach the
    # API and get its precise message instead of nginx's generic 413 page.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
